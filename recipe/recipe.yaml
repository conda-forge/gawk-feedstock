# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.4.1"

package:
  name: gawk
  version: ${{ version }}

source:
  - url: https://ftp.gnu.org/gnu/gawk/gawk-${{ version }}.tar.gz
    sha256: 8b3b0ea83930311a3f30905d3ce898d32c6103c2fe20d6a90b40341171b174de
    patches:
      - if: osx
        then: 0007-osx-map-anonymous.patch
  - file_name: bootstrap.sh
    url: http://git.savannah.gnu.org/cgit/gawk.git/plain/bootstrap.sh?h=gawk-${{ version }}
    sha256: 8aaf0cb1653e4c9535a906cf1cad04eb3f7877e554300139754dba48fb5f8bd2

build:
  number: 1
  skip: not unix
  script:
    # just sets some timestamps
    - bash ./bootstrap.sh
    - |-
      bash ./configure \
        --prefix="${PREFIX}" \
        --with-mpfr="${PREFIX}" \
        --with-readline="${PREFIX}"
    - make -j${CPU_COUNT}
    # presently skipped due to (likely) docker locale issues
    # - make check
    - make install
    - make installcheck

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - coreutils
    - gnuconfig
    - grep
    - make
    - sed
  host:
    - gettext
    - gmp
    - mpfr
    - readline
  run:
    - gmp
    - mpfr

tests:
  - script:
      - gawk --version | grep -iE "${{ version | replace(".", "\\.") }}"
      - gawk --help
      - awk --version | grep -iE "${{ version | replace(".", "\\.") }}"
      - awk --help

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: |
    The awk utility interprets a special-purpose programming language that
    makes it easy to handle simple data-reformatting jobs.
  description: |
    The GNU implementation of awk is called gawk; if you invoke it with the
    proper options or environment variables, it is fully compatible with the
    POSIX1 specification of the awk language and with the Unix version of awk
    maintained by Brian Kernighan. This means that all properly written awk
    programs should work with gawk. So most of the time, we don’t distinguish
    between gawk and other awk implementations.
  homepage: https://www.gnu.org/software/gawk
  repository: http://savannah.gnu.org/projects/gawk
  documentation: https://www.gnu.org/software/gawk/manual/gawk.html

extra:
  recipe-maintainers:
    - bollwyvl
